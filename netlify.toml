# NUTZ · Forms — Netlify deploy config
# הטפסים הם קבצי HTML עצמאיים (פונטים ו-CSS מוטמעים), אין שלב build.
#
# הנתיבים הציבוריים:
#   https://nutz-forms.netlify.app/intake/form   גליון הרשמה
#   https://nutz-forms.netlify.app/health/form   גליון הצהרת בריאות
#
# כללי הפניה (אותיות גדולות, נתיבים מקוצרים) יושבים ב-public/_redirects,
# כדי שיעבדו גם בהעלאה ידנית של התיקייה וגם בפריסה מ-Git.

[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
